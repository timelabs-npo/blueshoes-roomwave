name: Inspect pinned native evidence

on:
  pull_request:
    branches:
      - diagnostics/avatar-data-41ed-20261126
    paths:
      - 'ops/diagnostics/**'
      - '.github/workflows/inspect-native-evidence.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: inspect-native-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: boot-readiness-751726d
            request: ops/diagnostics/boot-751726d-evidence-request.json
    name: Inspect ${{ matrix.label }}
    steps:
      - name: Check out inspection source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check bounded reader syntax
        run: python3 -m py_compile ops/diagnostics/inspect-native-evidence.py
      - name: Verify original ZIP and print selected evidence
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_REQUEST: ${{ matrix.request }}
        run: 'python3 ops/diagnostics/inspect-native-evidence.py "$EVIDENCE_REQUEST"'
      - name: Preserve hash-verified original first-attempt ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-native-45739502906-attempt-1
          path: build/diagnostic-originals
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
