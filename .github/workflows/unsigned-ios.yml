name: Unsigned iOS readiness

on:
  workflow_dispatch:
    inputs:
      runner_class:
        description: GPU XLarge is billable and requires organization access; standard remains the default
        type: choice
        options: [standard, gpu]
        default: standard
      runtime_version:
        description: Simulator runtime (27.0 is a diagnostic comparison, not the release gate)
        type: choice
        options:
          - sdk-matched
          - '27.0'
        default: sdk-matched
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/ios/**'
      - 'Assets/**'
      - 'VERSION'
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - '.github/workflows/unsigned-ios.yml'

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}-${{ inputs.runtime_version || 'sdk-matched' }}-${{ inputs.runner_class || 'standard' }}
  cancel-in-progress: true

jobs:
  readiness:
    # Forked public PR code must not execute on this trusted native runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_class == 'gpu' && 'xcode-27-xlarge' || 'xcode-27' }}
    # Individual native/boot/archive limits total up to 49 minutes. Leave room
    # for bounded diagnostics and the artifact steps when one limit is reached.
    timeout-minutes: 65
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure public X OAuth client
        run: python3 scripts/release/configure-x.py
        env:
          X_OAUTH_CLIENT_ID: ${{ vars.X_OAUTH_CLIENT_ID }}
      - name: Select stable Xcode 27.2
        run: bash scripts/release/select-xcode.sh
      - name: Record actual Metal device capabilities
        timeout-minutes: 2
        run: |
          mkdir -p build
          xcrun swift scripts/ci/metal-inventory.swift > build/runner-metal.json
          cat build/runner-metal.json
      - name: Install project generator if needed
        timeout-minutes: 6
        run: command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Test core, actual touch flow, native render and unsigned archive
        timeout-minutes: 55
        run: bash scripts/release/validate-native.sh
        env:
          ROOMWAVE_DIAGNOSTIC_RUNTIME: ${{ inputs.runtime_version == '27.0' && '27.0' || '' }}
      - name: Preserve runner inventory beside native receipts
        if: always()
        timeout-minutes: 1
        run: |
          if [[ -f build/runner-metal.json ]]; then
            mkdir -p build/release
            cp build/runner-metal.json build/release/runner-metal.json
          fi
      - name: Preserve lightweight native review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roomwave-native-review
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/release/evidence/*.json
            build/release/evidence/*.png
            build/release/evidence/*.txt
            build/release/evidence/ui-attachments/*.json
            build/release/evidence/ui-attachments/*.png
            build/release/evidence/ui-attachments/*.txt
            build/release/evidence/ui-attachments/*.ips
            build/release/evidence/ui-attachments/*.crash
            build/release/evidence/live-diagnostics
            build/release/evidence/metal-diagnostics
            build/release/*identity.json
            build/release/native-run-start.json
            build/release/simulator-selection.json
            build/release/native-test.log
            build/release/runner-metal.json
            build/release/metal-diagnostics.log
            build/release/diagnostic-observer.log
            build/release/container.log
            build/release/attachments-export.log
            build/release/evidence-collection.json
            build/release/recording-observer.log
      - name: Preserve playable evidence and unsigned simulator app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roomwave-arcade-evidence
          path: |
            build/release/evidence
            build/release/*.json
            build/release/*.log
            build/release/Roomwave-simulator.app.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roomwave-native-test-results
          path: build/release/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
