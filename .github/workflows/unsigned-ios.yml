name: Unsigned iOS readiness

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select stable Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for app in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$app/Contents/Developer" ]; then
              version="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version)"
              if [ "$(printf '%s\n' "$version" | head -n 1)" = "Xcode 27.2" ]; then
                selected="$app/Contents/Developer"
                break
              fi
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::Stable Xcode 27.2 was not found."
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcodebuild -version
          DEVELOPER_DIR="$selected" xcodebuild -showsdks
          DEVELOPER_DIR="$selected" swift --version
      - name: Test shared core
        run: swift test --parallel
      - name: Install XcodeGen if needed
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
      - name: Generate native project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Choose and boot an iOS 27 simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[x for k,v in d["devices"].items() if "iOS-27" in k for x in v if x.get("isAvailable",False) and x["name"].startswith("iPhone")]; rows.sort(key=lambda x:(x["name"]!="iPhone 18 Pro Max",x["name"])); assert rows,"No available iOS 27 iPhone simulator"; print(rows[0]["udid"])')"
          echo "ROOMWAVE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Build and test native pilot without signing
        working-directory: apps/ios
        run: >-
          xcodebuild -project Roomwave.xcodeproj -scheme Roomwave
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$ROOMWAVE_SIMULATOR_ID"
          -derivedDataPath ../../.derivedData
          -resultBundlePath ../../build/native-test-results/RoomwaveNative.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Capture the running simulator pilot
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pilot-artifacts
          simulator_app=".derivedData/Build/Products/Debug-iphonesimulator/Roomwave.app"
          python3 scripts/release/verify-app.py "$simulator_app" --build 1 > build/pilot-artifacts/simulator-identity.json
          xcrun simctl install "$ROOMWAVE_SIMULATOR_ID" "$simulator_app"
          xcrun simctl launch --terminate-running-process "$ROOMWAVE_SIMULATOR_ID" org.timelabs.blueshoes.roomwave --pilot-demo
          sleep 5
          xcrun simctl io "$ROOMWAVE_SIMULATOR_ID" screenshot build/pilot-artifacts/Roomwave-demo.png
          xcrun simctl launch --terminate-running-process "$ROOMWAVE_SIMULATOR_ID" org.timelabs.blueshoes.roomwave --pilot-race
          sleep 4
          xcrun simctl io "$ROOMWAVE_SIMULATOR_ID" screenshot build/pilot-artifacts/Roomwave-race.png
          ditto -c -k --keepParent "$simulator_app" build/pilot-artifacts/Roomwave-simulator.app.zip
          git rev-parse HEAD > build/pilot-artifacts/source-sha.txt
          xcrun simctl list devices "$ROOMWAVE_SIMULATOR_ID" > build/pilot-artifacts/simulator.txt
      - name: Archive the unsigned device Release pilot
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pilot-artifacts
          if ! xcodebuild -project apps/ios/Roomwave.xcodeproj -scheme Roomwave \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/UnsignedRoomwave.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=1 MARKETING_VERSION=0.1.0 archive \
            > build/pilot-artifacts/unsigned-archive.log 2>&1; then
            tail -n 120 build/pilot-artifacts/unsigned-archive.log
            exit 1
          fi
          python3 scripts/release/verify-app.py build/UnsignedRoomwave.xcarchive/Products/Applications/Roomwave.app --build 1 > build/pilot-artifacts/device-identity.json
          ditto -c -k --keepParent build/UnsignedRoomwave.xcarchive build/pilot-artifacts/UnsignedRoomwave.xcarchive.zip
      - name: Preserve runnable pilot and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomwave-pilot-artifacts
          path: build/pilot-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomwave-native-test-results
          path: build/native-test-results
          if-no-files-found: ignore
          retention-days: 7
