name: Unsigned iOS readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'apps/ios/**'
      - 'Assets/**'
      - 'VERSION'
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - '.github/workflows/unsigned-ios.yml'

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    # Forked public PR code must not execute on this trusted native runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select stable Xcode 27.2
        run: bash scripts/release/select-xcode.sh
      - name: Install project generator if needed
        timeout-minutes: 6
        run: command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Test core, actual touch flow, native render and unsigned archive
        run: bash scripts/release/validate-native.sh
      - name: Preserve playable evidence and unsigned simulator app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roomwave-arcade-evidence
          path: |
            build/release/evidence
            build/release/*.json
            build/release/*.log
            build/release/Roomwave-simulator.app.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roomwave-native-test-results
          path: build/release/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
