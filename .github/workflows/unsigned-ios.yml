name: Unsigned iOS readiness

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select stable Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for app in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$app/Contents/Developer" ]; then
              version="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version)"
              if [ "$(printf '%s\n' "$version" | head -n 1)" = "Xcode 27.2" ]; then
                selected="$app/Contents/Developer"
                break
              fi
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::Stable Xcode 27.2 was not found."
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcodebuild -version
          DEVELOPER_DIR="$selected" xcodebuild -showsdks
          DEVELOPER_DIR="$selected" swift --version
      - name: Test shared core
        run: swift test --parallel
      - name: Install XcodeGen if needed
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
      - name: Generate native project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Choose and boot an iOS 27 simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[x for k,v in d["devices"].items() if "iOS-27" in k for x in v if x.get("isAvailable",False) and x["name"].startswith("iPhone")]; rows.sort(key=lambda x:(x["name"]!="iPhone 18 Pro Max",x["name"])); assert rows,"No available iOS 27 iPhone simulator"; print(rows[0]["udid"])')"
          echo "ROOMWAVE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Build and test native pilot without signing
        working-directory: apps/ios
        run: >-
          xcodebuild -project Roomwave.xcodeproj -scheme Roomwave
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$ROOMWAVE_SIMULATOR_ID"
          -derivedDataPath ../../.derivedData
          -resultBundlePath ../../.test-results/RoomwaveNative.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomwave-native-test-results
          path: .test-results
          if-no-files-found: ignore
          retention-days: 7
