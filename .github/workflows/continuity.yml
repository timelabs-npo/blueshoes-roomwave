name: Roomwave continuity checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/continuity/**'
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'tests/continuity/**'
      - 'scripts/release/public-beta.mjs'
      - 'scripts/release/finalize-internal.mjs'
      - 'ops/tasks/**'
      - 'docs/CONTINUITY.md'
      - '.github/workflows/continuity.yml'
  workflow_run:
    workflows: ['Unsigned iOS readiness', 'Roomwave TestFlight pilot']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: continuity-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source (trusted default branch for workflow completion events)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test bounded supervisor without Codex or credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests/continuity -v
          python3 -m unittest discover -s tests/ci -v
      - name: Record observed event only
        run: python3 scripts/continuity/workflow_receipt.py build/continuity/event.json
      - name: Preserve reviewable event receipt
        uses: actions/upload-artifact@v4
        with:
          name: roomwave-continuity-${{ github.run_id }}
          path: build/continuity/event.json
          retention-days: 14
          if-no-files-found: error
